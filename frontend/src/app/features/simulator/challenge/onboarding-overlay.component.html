@if (step) {
  <div class="onboarding-card" role="dialog" aria-live="polite">
    <div class="onboarding-progress">
      <span class="step-count">Step {{ stepNumber }} of {{ total }}</span>
      <div class="dots">
        @for (s of onboarding.steps; track s; let i = $index) {
          <span class="dot" [class.active]="i < stepNumber"></span>
        }
      </div>
    </div>
    <h3>{{ step.title }}</h3>
    <p>{{ step.body }}</p>
    <div class="onboarding-actions">
      <button type="button" class="skip" (click)="skip()">Skip tour</button>
      @if (isManual) {
        <button type="button" class="next" (click)="next()">
          {{ stepNumber === total ? 'Finish' : 'Next' }}
        </button>
      }
      @if (!isManual) {
        <span class="waiting"> <i class="fas fa-hand-pointer"></i> Try it on the canvas… </span>
      }
    </div>
  </div>
}
